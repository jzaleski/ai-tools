# Router preset config — server mode
# Keys use llama-server long-form flag names (no leading dashes).
# The [*] section supplies defaults inherited by every model section.
# Each named section becomes a routable model alias.

[*]
flash-attn        = on
n-gpu-layers      = -1
batch-size        = 4096
ubatch-size       = 1024
ctx-size          = 262144
cache-type-k      = q8_0
cache-type-v      = q8_0
presence-penalty  = 1.5
repeat-penalty    = 1.0
min-p             = 0.01
temp              = 1.0
top-k             = 20
top-p             = 0.95

[jzaleski/server]
model             = ${HOME}/.cache/models/Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf
