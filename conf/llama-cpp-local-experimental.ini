flash-attn        = on
n-gpu-layers      = -1
batch-size        = 2048
ubatch-size       = 512
ctx-size          = 81920
cache-type-k      = q4_0
cache-type-v      = q4_0
presence-penalty  = 1.5
repeat-penalty    = 1.0
temp              = 1.0
top-p             = 0.95

[jzaleski/cipher]
min-p             = 0.01
top-k             = 40

[jzaleski/sage]
min-p             = 0.0
top-k             = 20
