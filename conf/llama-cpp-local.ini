# Router preset config — local mode
# Keys use llama-server long-form flag names (no leading dashes).
# The [*] section supplies defaults inherited by every model section.
# Each named section becomes a routable model alias.

[*]
flash-attn        = on
n-gpu-layers      = -1
batch-size        = 2048
ubatch-size       = 512
ctx-size          = 81920
cache-type-k      = q4_0
cache-type-v      = q4_0
presence-penalty  = 1.5
repeat-penalty    = 1.0
min-p             = 0.01
temp              = 1.0
top-k             = 20
top-p             = 0.95

[jzaleski/local]
model             = ${HOME}/.cache/models/unsloth/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
